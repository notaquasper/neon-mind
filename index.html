<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060a" />
<meta name="description" content="NEON MIND — a fast neon memory game. Watch the sequence, repeat it, survive." />
<title>NEON MIND — Memory Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c0: #00e5ff;
    --c1: #ff2d95;
    --c2: #7cff3d;
    --c3: #ffb020;
    --bg: #05060a;
    --panel: rgba(255,255,255,.05);
    --border: rgba(255,255,255,.1);
    --text: #eef2ff;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* ambient background blobs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .3;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 65vmax; height: 65vmax;
    background: radial-gradient(circle, #00e5ff, transparent 70%);
    top: -25vmax; left: -25vmax;
    animation: drift1 22s ease-in-out infinite;
  }
  body::after {
    width: 55vmax; height: 55vmax;
    background: radial-gradient(circle, #ff2d95, transparent 70%);
    bottom: -25vmax; right: -25vmax;
    animation: drift2 28s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(12vmax, 8vmax) scale(1.15); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-10vmax, -8vmax) scale(1.1); }
  }

  /* ---------- layout ---------- */
  #app {
    position: relative;
    z-index: 1;
    width: min(92vw, 440px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
  }
  #app.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(4px, -2px); }
    30%, 50%, 70% { transform: translate(-7px, 3px); }
    40%, 60% { transform: translate(7px, -3px); }
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(18px, 5.2vw, 24px);
    letter-spacing: .14em;
    background: linear-gradient(90deg, var(--c0), var(--c2) 45%, var(--c1));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 16px rgba(0,229,255,.35));
    white-space: nowrap;
  }
  .logo span { color: transparent; }
  .logo.big { font-size: clamp(26px, 8vw, 38px); text-align: center; }

  .icon {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    padding: 0;
    display: grid;
    place-items: center;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: background .2s, transform .15s;
    backdrop-filter: blur(10px);
  }
  .icon:hover { background: rgba(255,255,255,.12); }
  .icon:active { transform: scale(.94); }

  /* ---------- stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 6px;
    text-align: center;
    backdrop-filter: blur(10px);
    transition: border-color .3s, box-shadow .3s;
  }
  .stat.pulse { border-color: rgba(0,229,255,.6); box-shadow: 0 0 24px rgba(0,229,255,.28); }
  .stat .label {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(238,242,255,.45);
  }
  .stat .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: .02em;
  }
  .stat .value .dim { color: rgba(238,242,255,.2); }

  /* ---------- board ---------- */
  .board {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    aspect-ratio: 1;
    padding: 12px;
    border-radius: 28px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.5);
  }

  .pad {
    position: relative;
    border-radius: 20px;
    cursor: pointer;
    background: var(--c);
    opacity: .2;
    border: 1px solid rgba(255,255,255,.08);
    overflow: hidden;
    transition: opacity .16s ease, transform .1s ease, box-shadow .22s ease;
    outline: none;
  }
  .pad::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.65), transparent 62%);
    opacity: .3;
    pointer-events: none;
  }
  .pad .key {
    position: absolute;
    bottom: 8px; right: 11px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: rgba(0,0,0,.4);
    z-index: 2;
    pointer-events: none;
  }
  @media (hover: hover) {
    .pad:hover { opacity: .34; }
  }
  .pad.active {
    opacity: 1;
    transform: scale(.965);
    box-shadow:
      0 0 34px var(--c),
      0 0 80px var(--c),
      inset 0 0 34px rgba(255,255,255,.45);
  }
  .pad[data-i="0"] { --c: var(--c0); }
  .pad[data-i="1"] { --c: var(--c1); }
  .pad[data-i="2"] { --c: var(--c2); }
  .pad[data-i="3"] { --c: var(--c3); }

  /* ---------- status + controls ---------- */
  .status {
    text-align: center;
    font-size: 12.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(238,242,255,.55);
    min-height: 1.3em;
    transition: color .25s;
  }
  .status.hot { color: var(--c0); text-shadow: 0 0 18px rgba(0,229,255,.6); }
  .status.bad { color: var(--c1); text-shadow: 0 0 18px rgba(255,45,149,.6); }

  .controls { display: flex; gap: 10px; }

  button {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    letter-spacing: .12em;
    font-size: 12px;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: background .2s, transform .12s, box-shadow .2s, border-color .2s;
    backdrop-filter: blur(10px);
    flex: 1;
    -webkit-user-select: none;
    user-select: none;
  }
  button:hover { background: rgba(255,255,255,.12); }
  button:active { transform: scale(.97); }

  button.primary {
    background: linear-gradient(135deg, var(--c0), #0b8dff);
    border-color: transparent;
    color: #041016;
    box-shadow: 0 10px 34px rgba(0,229,255,.32);
  }
  button.primary:hover {
    box-shadow: 0 12px 44px rgba(0,229,255,.5);
    filter: brightness(1.08);
  }

  /* ---------- overlay ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(5,6,10,.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .panel {
    width: min(92vw, 400px);
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    text-align: center;
    animation: pop .35s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  .hidden { display: none !important; }

  .tag {
    font-size: 12.5px;
    letter-spacing: .06em;
    color: rgba(238,242,255,.55);
    max-width: 30ch;
    line-height: 1.6;
  }

  h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 7vw, 30px);
    letter-spacing: .16em;
    color: var(--c1);
    text-shadow: 0 0 30px rgba(255,45,149,.5);
  }

  .badge {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: .2em;
    padding: 6px 14px;
    border-radius: 999px;
    color: #041016;
    background: linear-gradient(90deg, var(--c2), var(--c3));
    box-shadow: 0 0 30px rgba(124,255,61,.45);
    animation: glowPulse 1.6s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .results {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .results > div {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .results span {
    font-size: 9px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(238,242,255,.45);
  }
  .results b {
    font-family: 'Orbitron', sans-serif;
    font-size: 19px;
  }

  .diff {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
  }
  .diff button {
    padding: 11px 2px;
    font-size: 9.5px;
    letter-spacing: .08em;
    border-radius: 12px;
  }
  .diff button.sel {
    background: linear-gradient(135deg, var(--c0), #0b8dff);
    border-color: transparent;
    color: #041016;
    box-shadow: 0 0 26px rgba(0,229,255,.4);
  }

  .bestline {
    font-size: 11.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(238,242,255,.45);
  }
  .bestline b { color: var(--c2); font-family: 'Orbitron', sans-serif; }

  /* ---------- particles ---------- */
  .particle {
    position: fixed;
    width: 9px; height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    transform: translate(-50%, -50%) scale(1);
    transition: transform .68s cubic-bezier(.15,.8,.3,1), opacity .68s ease-out;
    will-change: transform, opacity;
  }

  @media (max-height: 700px) {
    .board { gap: 10px; padding: 10px; }
    #app { gap: 10px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">NEON<span>MIND</span></div>
    <button class="icon" id="btnSound" aria-label="Toggle sound">🔊</button>
  </header>

  <div class="stats">
    <div class="stat" id="statLevel"><div class="label">Level</div><div class="value" id="hudLevel">1</div></div>
    <div class="stat" id="statScore"><div class="label">Score</div><div class="value" id="hudScore">0</div></div>
    <div class="stat" id="statLives"><div class="label">Lives</div><div class="value" id="hudLives">♥♥♥</div></div>
  </div>

  <div class="board" id="board">
    <div class="pad" data-i="0"><span class="key">1</span></div>
    <div class="pad" data-i="1"><span class="key">2</span></div>
    <div class="pad" data-i="2"><span class="key">3</span></div>
    <div class="pad" data-i="3"><span class="key">4</span></div>
  </div>

  <div class="status" id="status">Press start to play</div>

  <div class="controls">
    <button id="btnRestart">Restart</button>
    <button id="btnMenu">Menu</button>
  </div>
</div>

<div class="overlay show" id="overlay">

  <!-- START PANEL -->
  <div class="panel" id="panelStart">
    <div class="logo big">NEON<span>MIND</span></div>
    <p class="tag">Watch the sequence. Repeat it. Survive as long as you can.</p>

    <div class="diff" id="diffGroup">
      <button data-diff="easy">EASY</button>
      <button data-diff="normal" class="sel">NORMAL</button>
      <button data-diff="hard">HARD</button>
      <button data-diff="insane">INSANE</button>
    </div>

    <div class="bestline">Best on <b id="diffLabel">Normal</b>: <b id="bestVal">0</b></div>

    <button class="primary" id="btnStart" style="width:100%">START</button>
  </div>

  <!-- GAME OVER PANEL -->
  <div class="panel hidden" id="panelOver">
    <h2>GAME OVER</h2>
    <div class="badge hidden" id="newBest">★ NEW BEST ★</div>

    <div class="results">
      <div><span>Level</span><b id="overLevel">1</b></div>
      <div><span>Score</span><b id="overScore">0</b></div>
      <div><span>Best</span><b id="overBest">0</b></div>
    </div>

    <button class="primary" id="btnAgain" style="width:100%">PLAY AGAIN</button>
    <button id="btnBackMenu" style="width:100%">CHANGE DIFFICULTY</button>
  </div>

</div>

<script>
(() => {
  'use strict';

  /* ============================================================
     CONFIG
  ============================================================ */
  const COLORS = ['#00e5ff', '#ff2d95', '#7cff3d', '#ffb020'];
  const PAD_FREQ = [523.25, 587.33, 659.25, 783.99]; // C5 D5 E5 G5 (pentatonic-ish)

  const DIFFICULTIES = {
    easy:   { label: 'Easy',   flash: 620, gap: 320, minGap: 210, lives: 5, scoreMul: 1.0 },
    normal: { label: 'Normal', flash: 460, gap: 225, minGap: 140, lives: 3, scoreMul: 1.5 },
    hard:   { label: 'Hard',   flash: 330, gap: 150, minGap: 90,  lives: 3, scoreMul: 2.5 },
    insane: { label: 'Insane', flash: 220, gap: 90,  minGap: 55,  lives: 2, scoreMul: 4.0 }
  };

  const HS_KEY = 'neonmind.highscores.v2';
  const PREF_KEY = 'neonmind.prefs.v2';

  /* ============================================================
     DOM
  ============================================================ */
  const $ = s => document.querySelector(s);
  const els = {
    app:        $('#app'),
    board:      $('#board'),
    pads:       [...document.querySelectorAll('.pad')],
    hudLevel:   $('#hudLevel'),
    hudScore:   $('#hudScore'),
    hudLives:   $('#hudLives'),
    statLevel:  $('#statLevel'),
    statScore:  $('#statScore'),
    statLives:  $('#statLives'),
    status:     $('#status'),
    overlay:    $('#overlay'),
    panelStart: $('#panelStart'),
    panelOver:  $('#panelOver'),
    diffGroup:  $('#diffGroup'),
    diffLabel:  $('#diffLabel'),
    bestVal:    $('#bestVal'),
    btnStart:   $('#btnStart'),
    btnAgain:   $('#btnAgain'),
    btnBackMenu:$('#btnBackMenu'),
    btnRestart: $('#btnRestart'),
    btnMenu:    $('#btnMenu'),
    btnSound:   $('#btnSound'),
    newBest:    $('#newBest'),
    overLevel:  $('#overLevel'),
    overScore:  $('#overScore'),
    overBest:   $('#overBest')
  };

  /* ============================================================
     AUDIO ENGINE (Web Audio API — no files needed)
  ============================================================ */
  const Sound = (() => {
    let ctx = null;
    let muted = false;

    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function note(freq, { dur = .3, type = 'sine', vol = .15, delay = 0 } = {}) {
      if (muted) return;
      const c = ensure();
      if (!c) return;
      const t0 = c.currentTime + delay;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }

    return {
      unlock() { ensure(); },
      toggle() { muted = !muted; return muted; },
      isMuted() { return muted; },
      setMuted(v) { muted = v; },

      pad(i, dur = .35) {
        const f = PAD_FREQ[i] || 440;
        note(f, { dur, type: 'sine', vol: .2 });
        note(f * 2, { dur: dur * .55, type: 'triangle', vol: .055 });
      },
      success() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          note(f, { dur: .22, type: 'triangle', vol: .11, delay: i * .065 }));
      },
      fail() {
        note(220, { dur: .18, type: 'sawtooth', vol: .1 });
        note(160, { dur: .3,  type: 'sawtooth', vol: .1, delay: .13 });
        note(110, { dur: .45, type: 'sawtooth', vol: .09, delay: .28 });
      },
      levelUp() {
        [659.25, 880, 1174.66].forEach((f, i) =>
          note(f, { dur: .2, type: 'sine', vol: .1, delay: i * .06 }));
      },
      gameOver() {
        [392, 329.63, 261.63, 196].forEach((f, i) =>
          note(f, { dur: .5, type: 'sine', vol: .13, delay: i * .16 }));
      },
      ui() {
        note(880, { dur: .08, type: 'sine', vol: .07 });
      }
    };
  })();

  /* ============================================================
     STORAGE
  ============================================================ */
  function loadScores() {
    try { return JSON.parse(localStorage.getItem(HS_KEY)) || {}; }
    catch { return {}; }
  }
  function getBest(diff) {
    return loadScores()[diff] || 0;
  }
  function setBest(diff, val) {
    const s = loadScores();
    s[diff] = val;
    try { localStorage.setItem(HS_KEY, JSON.stringify(s)); } catch {}
  }
  function loadPrefs() {
    try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; }
    catch { return {}; }
  }
  function savePrefs(obj) {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(obj)); } catch {}
  }

  /* ============================================================
     STATE
  ============================================================ */
  const state = {
    mode: 'menu',           // menu | showing | input | wait | over
    difficulty: 'normal',
    sequence: [],
    index: 0,
    level: 1,
    score: 0,
    lives: 3,
    maxLives: 3,
    gameId: 0
  };

  /* ============================================================
     HELPERS
  ============================================================ */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand4 = () => Math.floor(Math.random() * 4);

  function timings() {
    const d = DIFFICULTIES[state.difficulty];
    const t = Math.max(0, state.level - 1);
    return {
      flash: Math.max(115, d.flash - t * 17),
      gap:   Math.max(d.minGap, d.gap - t * 11)
    };
  }

  function setStatus(text, kind = '') {
    els.status.textContent = text;
    els.status.className = 'status' + (kind ? ' ' + kind : '');
  }

  function pulse(el) {
    el.classList.add('pulse');
    setTimeout(() => el.classList.remove('pulse'), 320);
  }

  function updateHUD() {
    els.hudLevel.textContent = state.level;
    els.hudScore.textContent = state.score;
    const lost = Math.max(0, state.maxLives - state.lives);
    els.hudLives.innerHTML =
      '♥'.repeat(state.lives) +
      (lost ? `<span class="dim">${'♥'.repeat(lost)}</span>` : '');
  }

  /* ============================================================
     PARTICLES
  ============================================================ */
  function burst(el, color, count = 16) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.background = color;
      p.style.boxShadow = `0 0 12px ${color}`;
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';
      document.body.appendChild(p);

      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const dist  = 45 + Math.random() * 95;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;

      requestAnimationFrame(() => {
        p.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.15)`
