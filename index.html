<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Mind</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, sans-serif;
    background: #0a0a12;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    user-select: none;
    touch-action: manipulation;
  }
  h1 {
    font-size: 24px;
    letter-spacing: 3px;
    margin-bottom: 15px;
    color: #00e5ff;
    text-shadow: 0 0 20px #00e5ff;
  }
  .hud {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
    font-size: 14px;
  }
  .hud div { text-align: center; }
  .hud .label { font-size: 10px; opacity: 0.6; letter-spacing: 1px; }
  .hud .val { font-size: 20px; font-weight: bold; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: min(90vw, 340px);
    aspect-ratio: 1;
    margin-bottom: 15px;
  }
  .pad {
    border-radius: 20px;
    opacity: 0.25;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.2s;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .pad.on {
    opacity: 1;
    transform: scale(0.96);
  }
  .pad[data-i="0"] { background: #00e5ff; }
  .pad[data-i="0"].on { box-shadow: 0 0 40px #00e5ff; }
  .pad[data-i="1"] { background: #ff2d95; }
  .pad[data-i="1"].on { box-shadow: 0 0 40px #ff2d95; }
  .pad[data-i="2"] { background: #7cff3d; }
  .pad[data-i="2"].on { box-shadow: 0 0 40px #7cff3d; }
  .pad[data-i="3"] { background: #ffb020; }
  .pad[data-i="3"].on { box-shadow: 0 0 40px #ffb020; }

  .status {
    font-size: 14px;
    min-height: 22px;
    margin-bottom: 15px;
    letter-spacing: 1px;
    text-align: center;
  }
  button {
    padding: 14px 40px;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #00e5ff, #0080ff);
    color: #001020;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(0,229,255,0.4);
    touch-action: manipulation;
  }
  button:active { transform: scale(0.96); }
  .best { font-size: 12px; opacity: 0.6; margin-top: 10px; }
</style>
</head>
<body>
  <h1>NEON MIND</h1>

  <div class="hud">
    <div><div class="label">LEVEL</div><div class="val" id="level">1</div></div>
    <div><div class="label">SCORE</div><div class="val" id="score">0</div></div>
    <div><div class="label">BEST</div><div class="val" id="best">0</div></div>
  </div>

  <div class="grid">
    <div class="pad" data-i="0"></div>
    <div class="pad" data-i="1"></div>
    <div class="pad" data-i="2"></div>
    <div class="pad" data-i="3"></div>
  </div>

  <div class="status" id="status">Tap START to play</div>

  <button id="startBtn">START</button>
  <div class="best">Best: <span id="bestBottom">0</span></div>

<script>
(function() {
  var pads = document.querySelectorAll('.pad');
  var levelEl = document.getElementById('level');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var bestBottom = document.getElementById('bestBottom');
  var statusEl = document.getElementById('status');
  var startBtn = document.getElementById('startBtn');

  var sequence = [];
  var playerIndex = 0;
  var accepting = false;
  var level = 1;
  var score = 0;
  var playing = false;

  var best = parseInt(localStorage.getItem('neonBest') || '0', 10);
  bestEl.textContent = best;
  bestBottom.textContent = best;

  function sleep(ms) {
    return new Promise(function(r) { setTimeout(r, ms); });
  }

  function flash(i, dur) {
    return new Promise(function(resolve) {
      pads[i].classList.add('on');
      setTimeout(function() {
        pads[i].classList.remove('on');
        resolve();
      }, dur);
    });
  }

  function setStatus(t) {
    statusEl.textContent = t;
  }

  async function playSequence() {
    accepting = false;
    var speed = Math.max(220, 550 - level * 25);

    await sleep(500);

    for (var k = 0; k < sequence.length; k++) {
      await flash(sequence[k], speed * 0.65);
      await sleep(speed * 0.35);
    }

    accepting = true;
    playerIndex = 0;
    setStatus('YOUR TURN');
  }

  async function nextRound() {
    sequence.push(Math.floor(Math.random() * 4));
    levelEl.textContent = level;
    setStatus('WATCH...');
    await playSequence();
  }

  function startGame() {
    sequence = [];
    playerIndex = 0;
    level = 1;
    score = 0;
    playing = true;
    levelEl.textContent = 1;
    scoreEl.textContent = 0;
    nextRound();
  }

  async function handleTap(i) {
    if (!accepting) return;
    accepting = false;

    pads[i].classList.add('on');
    setTimeout(function() { pads[i].classList.remove('on'); }, 180);

    if (i !== sequence[playerIndex]) {
      // wrong
      setStatus('WRONG! Game over. Score: ' + score);
      playing = false;
      accepting = false;

      if (score > best) {
        best = score;
        localStorage.setItem('neonBest', String(best));
        bestEl.textContent = best;
        bestBottom.textContent = best;
      }
      return;
    }

    playerIndex++;

    if (playerIndex === sequence.length) {
      // round complete
      score += level * 10;
      scoreEl.textContent = score;
      setStatus('NICE! Level ' + (level + 1));
      level++;

      await sleep(800);
      nextRound();
    } else {
      accepting = true;
    }
  }

  for (var i = 0; i < pads.length; i++) {
    (function(idx) {
      pads[idx].addEventListener('click', function(e) {
        e.preventDefault();
        handleTap(idx);
      });
      pads[idx].addEventListener('touchstart', function(e) {
        e.preventDefault();
        handleTap(idx);
      }, { passive: false });
    })(i);
  }

  startBtn.addEventListener('click', function(e) {
    e.preventDefault();
    startGame();
  });
  startBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    startGame();
  }, { passive: false });
})();
</script>
</body>
</html>
